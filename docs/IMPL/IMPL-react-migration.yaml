        - id: B
          task: |
            ## Zustand Store + Hooks + Constants

            ### What to implement

            1. **src/store.ts** (NEW): Create the Zustand store matching the GraphStore
               interface contract exactly. Import types from existing modules:
               - `KnowingGraph, GraphNode, GraphEdge` from `./graph-data`
               - `Graph` from `graphology`

               Define types: `ViewMode`, `GroupBy`, `DisplaySettings`, `GraphState`.
               Export the `useGraphStore` hook.

               IMPORTANT: Do NOT store a Sigma instance in the Zustand store. The
               @react-sigma/core library provides its own `useSigma()` hook via React
               context (SigmaContainer). Components that need the Sigma instance will
               use `useSigma()` from `@react-sigma/core` instead.

               Store the graphology `Graph` instance and group labels in the store
               so components outside the SigmaContainer (like CommunityList) can
               access group metadata.

               Default settings:
               ```typescript
               const DEFAULT_SETTINGS: DisplaySettings = {
                 nodeScale: 1.0,
                 topLabelCount: 40,
                 edgeOpacity: 1.0,
                 labelSize: 11,
                 gravity: 1.0,
                 spread: 10,
                 maxNodes: 10000,
                 confidenceMin: 0,
                 crossCommunityOnly: false,
               };
               ```

               Implement all actions listed in the interface contract. For `toggleCommunity`,
               use a Set (note: Zustand needs a new Set() for reactivity):
               ```typescript
               toggleCommunity: (id) => set((state) => {
                 const next = new Set(state.activeCommunityIds);
                 if (next.has(id)) next.delete(id);
                 else next.add(id);
                 return { activeCommunityIds: next };
               }),
               ```

               For `resetSettings`:
               ```typescript
               resetSettings: () => set({
                 settings: { ...DEFAULT_SETTINGS },
                 activeCommunityIds: new Set(),
                 searchQuery: '',
               }),
               ```

            2. **src/hooks/useGraphLoader.ts** (NEW): Hook that builds a graphology Graph
               from KnowingGraph data, applying current display settings.

               This hook extracts the graph-building logic from renderSigma() in galaxy.ts
               (lines 68-206). It reads from the Zustand store and produces a graphology
               Graph instance that the SigmaContainer can render.

               Key logic to port from galaxy.ts:
               - Group assignment based on groupBy mode (lines 70-90)
               - Top 20 group filtering (lines 92-101)
               - Group-to-color mapping (lines 103-105)
               - Node filtering by maxNodes (lines 107-109)
               - Degree computation for sizing (lines 112-119)
               - Top-N label filtering (lines 122-123)
               - Seed positions on a circle per group (lines 126-135)
               - Node attribute assignment (lines 138-164)
               - Edge filtering and attribute assignment (lines 167-193)
               - ForceAtlas2 layout (lines 196-206)
               - Group label computation for sidebar (lines 561-567)

               ```typescript
               import { useEffect, useRef } from 'react';
               import Graph from 'graphology';
               import forceAtlas2 from 'graphology-layout-forceatlas2';
               import { useGraphStore } from '../store';
               import { COMMUNITY_COLORS } from '../constants';

               export function useGraphLoader(): void {
                 const graph = useGraphStore((s) => s.graph);
                 const groupBy = useGraphStore((s) => s.groupBy);
                 const settings = useGraphStore((s) => s.settings);
                 const viewMode = useGraphStore((s) => s.viewMode);
                 const setSigmaGraph = useGraphStore((s) => s.setSigmaGraph);
                 const setGroupLabels = useGraphStore((s) => s.setGroupLabels);

                 useEffect(() => {
                   if (!graph || viewMode === 'galaxy3d') {
                     setSigmaGraph(null);
                     return;
                   }

                   // Build graphology graph from KnowingGraph data.
                   // Port the logic from galaxy.ts renderSigma() lines 68-206.
                   const sigmaGraph = new Graph();

                   // ... (group assignment, node/edge building, ForceAtlas2 layout)
                   // See galaxy.ts for the complete implementation to port.

                   setSigmaGraph(sigmaGraph);
                   setGroupLabels(/* computed group labels */);

                   return () => { /* no cleanup needed; graph is just data */ };
                 }, [graph, groupBy, settings, viewMode]);
               }
               ```

               Port ALL the graph-building logic from galaxy.ts renderSigma(). The
               existing galaxy.ts renderSigma() function does both graph building AND
               Sigma rendering; this hook extracts ONLY the graph building part. The
               Sigma rendering is handled by @react-sigma/core's SigmaContainer.

            3. **src/hooks/useOverlayEffects.ts** (NEW): Hook that applies view overlays
               to the Sigma graph. This hook runs INSIDE the SigmaContainer context
               (rendered as a child of SigmaContainer) so it can call useSigma() from
               @react-sigma/core.

               Port the overlay logic from galaxy.ts:
               - highlightCommunities (lines 296-319)
               - resetHighlight (lines 321-334)
               - highlightSearch (lines 336-347)
               - applyBlast (lines 349-379)
               - applyProvenance (lines 382-399)
               - applyDiff (lines 401-420)
               - applyBlame (lines 424-476)
               - highlightAuthor (lines 479-507)
               - applyCoverage (lines 510-546)
               - Hover effects (lines 237-277)

               ```typescript
               import { useEffect } from 'react';
               import { useSigma, useRegisterEvents } from '@react-sigma/core';
               import { useGraphStore } from '../store';
               import { computeBlastRadius } from '../blast-radius';
               import { computeDiff } from '../timeline';
               import { loadGraph } from '../graph-data';

               export function useOverlayEffects(): void {
                 const sigma = useSigma();
                 const graph = sigma.getGraph();
                 const registerEvents = useRegisterEvents();
                 const viewMode = useGraphStore((s) => s.viewMode);
                 const knGraph = useGraphStore((s) => s.graph);
                 const selectedNode = useGraphStore((s) => s.selectedNode);
                 const searchQuery = useGraphStore((s) => s.searchQuery);
                 const activeCommunityIds = useGraphStore((s) => s.activeCommunityIds);
                 const selectNode = useGraphStore((s) => s.selectNode);
                 const setBlameAuthorColors = useGraphStore((s) => s.setBlameAuthorColors);

                 // Register click/hover events
                 useEffect(() => {
                   registerEvents({
                     clickNode: ({ node }) => {
                       const gNode = knGraph?.nodes.find(n => n.id === node) || null;
                       const edges = knGraph?.edges.filter(e => e.source === node || e.target === node) || [];
                       selectNode(gNode, edges);
                     },
                     clickStage: () => {
                       resetHighlight(graph);
                       selectNode(null);
                     },
                     enterNode: ({ node }) => { /* highlight neighbors */ },
                     leaveNode: () => { /* reset highlight */ },
                   });
                 }, [registerEvents, knGraph]);

                 // Apply overlay based on viewMode
                 useEffect(() => {
                   if (!graph) return;
                   switch (viewMode) {
                     case 'provenance': applyProvenance(graph); break;
                     case 'blame': {
                       const colors = applyBlame(graph, sigma);
                       setBlameAuthorColors(colors);
                       break;
                     }
                     case 'coverage': applyCoverage(graph, sigma); break;
                     case 'timeline': {
                       (async () => {
                         try {
                           const before = await loadGraph(import.meta.env.BASE_URL + 'graph-before.json');
                           if (knGraph) {
                             const diff = computeDiff(before, knGraph);
                             applyDiff(graph, diff.addedNodes, diff.addedEdges);
                           }
                         } catch { /* no baseline */ }
                       })();
                       break;
                     }
                     case 'communities': resetHighlight(graph); break;
                   }
                 }, [viewMode, graph]);

                 // Apply community highlighting
                 useEffect(() => {
                   if (activeCommunityIds.size > 0) highlightCommunities(graph, activeCommunityIds);
                   else if (viewMode === 'communities') resetHighlight(graph);
                 }, [activeCommunityIds]);

                 // Apply search highlighting
                 useEffect(() => {
                   if (!searchQuery.trim()) { resetHighlight(graph); return; }
                   const matches = new Set(
                     knGraph?.nodes
                       .filter(n => n.shortName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    n.label.toLowerCase().includes(searchQuery.toLowerCase()))
                       .map(n => n.id) || []
                   );
                   highlightSearch(graph, matches);
                 }, [searchQuery]);
               }

               // Port the helper functions (resetHighlight, highlightCommunities, etc.)
               // from galaxy.ts. They operate on the graphology Graph instance directly.
               ```

            4. **src/constants.ts** (NEW): Extract the duplicated COMMUNITY_COLORS array
               and communityColor function into a shared module:
               ```typescript
               export const COMMUNITY_COLORS = [
                 '#3fb950', '#58a6ff', '#d29922', '#bc8cff',
                 '#39d2c0', '#f85149', '#7ee787', '#79c0ff',
                 '#a5d6ff', '#ffd33d', '#56d4dd', '#ff7b72',
                 '#8b949e', '#d2a8ff', '#2ea043', '#e3b341',
               ];

               export function communityColor(id: number): string {
                 return COMMUNITY_COLORS[id % COMMUNITY_COLORS.length];
               }
               ```

            ### Constraints
            - Do NOT store a Sigma instance in the Zustand store. Use @react-sigma/core's
