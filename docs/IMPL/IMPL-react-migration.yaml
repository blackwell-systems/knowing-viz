                       {community ? community.label : 'ungrouped'} ({community?.size || 0} symbols)
                     </div>
                     <div className="detail-label">Signature</div>
                     <div className="detail-code">{selectedNode.signature || 'n/a'}</div>
                     <div className="detail-section">
                       <div className="detail-label">Callers <span className="stat-highlight">{callers.length}</span></div>
                       <EdgeList edges={callers} peerField="source" nodeMap={nodeMap} />
                     </div>
                     <div className="detail-section">
                       <div className="detail-label">Callees <span className="stat-highlight">{callees.length}</span></div>
                       <EdgeList edges={callees} peerField="target" nodeMap={nodeMap} />
                     </div>
                   </>
                 );
               }

               function EdgeList({ edges, peerField, nodeMap }: {
                 edges: import('../graph-data').GraphEdge[];
                 peerField: 'source' | 'target';
                 nodeMap: Map<string, string>;
               }) {
                 if (edges.length === 0) return <ul className="edge-list"><li>none</li></ul>;
                 return (
                   <ul className="edge-list">
                     {edges.slice(0, 20).map((e, i) => (
                       <li key={i}>
                         <span className={e.crossCommunity ? 'edge-cross' : 'edge-type'}>{e.type}</span>
                         {' '}{nodeMap.get(e[peerField]) || e[peerField].slice(0, 8)}
                       </li>
                     ))}
                     {edges.length > 20 && <li className="more">+{edges.length - 20} more</li>}
                   </ul>
                 );
               }
               ```

            3. **src/components/BlastDetail.tsx** (NEW): Blast radius detail view.
               Port from main.ts lines 162-184 (showBlastDetail).
               ```tsx
               import { useMemo } from 'react';
               import { useGraphStore } from '../store';
               import { computeBlastRadius } from '../blast-radius';

               export function BlastDetail() {
                 const selectedNode = useGraphStore((s) => s.selectedNode);
                 const graph = useGraphStore((s) => s.graph);

                 const result = useMemo(() => {
                   if (!selectedNode || !graph) return null;
                   return computeBlastRadius(graph, selectedNode.id, 4);
                 }, [selectedNode, graph]);

                 if (!result || !selectedNode || !graph) return null;

                 // Build node name map
                 const nodeMap = new Map<string, string>();
                 graph.nodes.forEach(n => nodeMap.set(n.id, n.shortName));

                 // Group by depth
                 const byDepth = new Map<number, string[]>();
                 for (const [id, depth] of result.affected) {
                   if (depth === 0) continue;
                   const list = byDepth.get(depth) || [];
                   list.push(nodeMap.get(id) || id.slice(0, 8));
                   byDepth.set(depth, list);
                 }

                 return (
                   <>
                     <div className="detail-label">Center</div>
                     <div className="detail-code">{selectedNode.label}</div>
                     <div className="detail-label">Total Affected</div>
                     <div className="detail-value">
                       <span className="stat-danger">{result.affected.size - 1}</span> symbols
                     </div>
                     {[...byDepth.entries()].sort(([a], [b]) => a - b).map(([depth, names]) => (
                       <div className="detail-section" key={depth}>
                         <div className="detail-label">
                           Depth {depth} <span className="stat-highlight">{names.length}</span>
                         </div>
                         <ul className="edge-list">
                           {names.map((n, i) => <li key={i}>{n}</li>)}
                         </ul>
                       </div>
                     ))}
                   </>
                 );
               }
               ```

            4. **src/components/NodeList.tsx** (NEW): Browsable, filterable node list.
               Port from main.ts lines 196-278. Each node item is clickable to select.
               Note: Camera centering on click requires Sigma access; since NodeList is
               rendered inside the DetailPanel (which may or may not be inside SigmaContainer),
               store a camera-animate callback in the store or use an event pattern. For the
               initial migration, implement selection without camera animation (the
               integration wave will wire camera centering).
               ```tsx
               import { useMemo, useState } from 'react';
               import { useGraphStore } from '../store';
               import { communityColor } from '../constants';

               export function NodeList() {
                 const graph = useGraphStore((s) => s.graph);
                 const selectNode = useGraphStore((s) => s.selectNode);
                 const selectedNode = useGraphStore((s) => s.selectedNode);
                 const [filter, setFilter] = useState('');

                 const sortedNodes = useMemo(() => {
                   if (!graph) return [];
                   return [...graph.nodes].sort((a, b) => a.shortName.localeCompare(b.shortName));
                 }, [graph]);

                 const filtered = useMemo(() => {
                   if (!filter.trim()) return sortedNodes;
                   const q = filter.toLowerCase().trim();
                   return sortedNodes.filter(n =>
                     n.shortName.toLowerCase().includes(q) || n.label.toLowerCase().includes(q)
                   );
                 }, [sortedNodes, filter]);

                 const handleClick = (node: typeof sortedNodes[0]) => {
                   const edges = graph?.edges.filter(e => e.source === node.id || e.target === node.id) ?? [];
                   selectNode(node, edges);
                 };

                 return (
                   <div className="node-list-container">
                     <input
                       type="text"
                       className="node-filter"
                       placeholder="Filter nodes..."
                       value={filter}
                       onChange={(e) => setFilter(e.target.value)}
                     />
                     <div className="node-list">
                       {filtered.map((node) => (
                         <div
                           key={node.id}
                           className={`node-list-item ${selectedNode?.id === node.id ? 'active' : ''}`}
                           onClick={() => handleClick(node)}
                         >
                           <span className="node-list-dot" style={{ background: communityColor(node.community) }} />
                           <span>{node.shortName}</span>
                           <span className="node-list-kind">{node.kind}</span>
                         </div>
                       ))}
                     </div>
                   </div>
                 );
               }
               ```

