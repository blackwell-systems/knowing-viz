pre_mortem:
    overall_risk: medium
    rows:
        - scenario: |
            @react-sigma/core's SigmaContainer may not accept a pre-built graphology Graph
            directly. The library may expect to manage its own graph instance internally,
            requiring the useLoadGraph hook instead of passing graph as a prop.
          likelihood: medium
          impact: medium
          mitigation: |
            If SigmaContainer does not accept a graph prop, Agent C should use
            @react-sigma/core's useLoadGraph hook inside a child component of
            SigmaContainer. The hook receives the sigma instance and can call
            sigma.getGraph().import(sigmaGraph.export()) to load the pre-built graph.
            The useGraphLoader hook should be adapted accordingly.
        - scenario: |
            react-force-graph-3d may have TypeScript type issues or SSR incompatibilities
            with Vite. The library wraps Three.js which has known issues with
            non-browser environments during build.
          likelihood: medium
          impact: low
          mitigation: |
            Use dynamic import for react-force-graph-3d (React.lazy) to avoid SSR/build
            issues. The existing galaxy3d.ts already uses @ts-ignore for ForceGraph3D
            imports, suggesting this is a known typing issue. skipLibCheck in tsconfig
            handles most type mismatches.
        - scenario: |
            CSS class name mismatches between the migrated App.css and the React components.
            The old CSS uses ID selectors (#sidebar, #graph-container) but React components
            use class selectors (.sidebar, .graph-container).
          likelihood: medium
          impact: low
          mitigation: |
            Agent A's task explicitly lists all ID-to-class selector conversions. Wave 2
            components use className props matching the converted class names.
        - scenario: |
            Store subscriptions cause excessive re-renders. Every slider change triggers
            a full graph rebuild via useGraphLoader, which is expensive (ForceAtlas2 layout).
          likelihood: medium
          impact: medium
          mitigation: |
            Zustand's selector-based subscriptions prevent unnecessary re-renders. The
            useGraphLoader hook depends on the settings object reference, so it only
            rebuilds when settings actually change. Consider adding useMemo or debouncing
            to slider changes if performance is poor. This matches the current behavior
            where every slider change calls rerender().
        - scenario: |
            Agent B creates hooks that import from @react-sigma/core but the package is
            not installed yet (Agent A installs it). Build failure in isolated worktree.
          likelihood: high
          impact: medium
          mitigation: |
            Both agents run in Wave 1 simultaneously. Agent B's verification step uses
            --skipLibCheck as a fallback. After Wave 1 merge, all packages from both
            agents are installed. The critical path is that Agent A's npm install must
            succeed for the merged result to build.
        - scenario: |
            Toolbar Screenshot/Fit buttons require Sigma instance access but Toolbar
            renders outside SigmaContainer, making useSigma() unavailable.
          likelihood: high
          impact: low
          mitigation: |
            Agent D implements Toolbar with Reset only; Screenshot and Fit are TODO stubs.
            The integration wave (Agent F) or a follow-up task can wire these by either
            (a) moving Toolbar inside SigmaContainer, (b) storing a sigma ref in the
            Zustand store via a callback, or (c) using a React ref forwarded from
            GraphViewer.
