title: React + Vite + TypeScript Migration
feature_slug: react-migration
verdict: SUITABLE
suitability_assessment: |
    1. File decomposition: The migration creates 20+ new files (components, store, hooks,
       config) with clear disjoint ownership. No two agents need the same new file.
       Existing framework-agnostic modules (blast-radius.ts, provenance.ts, timeline.ts,
       graph-data.ts) remain unchanged. galaxy.ts and galaxy3d.ts are superseded by
       @react-sigma/core and react-force-graph-3d respectively but kept for reference.

    2. Investigation-first items: None. The current codebase is well-understood; this
       is a straightforward rewrite from imperative DOM to React components.

    3. Interface discoverability: Yes. The Zustand store shape can be fully defined
       upfront from the existing state in main.ts (closures over graph, currentView,
       currentGroupBy, sigmaInst, activeCommunityIds, slider values). Component props
       derive directly from store selectors.

    4. Pre-implementation status: All code is vanilla TS. Nothing is partially migrated.

    5. Parallelization value: High. 6 agents across 3 waves, with 3 parallel agents in
       Wave 2. The coordination value is also high since component interfaces must be
       consistent. The new React wrapper libraries (@react-sigma/core, react-force-graph-3d)
       simplify implementation significantly, reducing per-agent time.

    Tech stack:
    - react, react-dom, @types/react, @types/react-dom
    - zustand (state management)
    - @react-sigma/core (React wrapper for Sigma.js)
    - react-force-graph-3d (React wrapper for 3D force graphs)
    - @react-three/fiber, @react-three/drei (React Three.js integration)
    - framer-motion (UI animations)
    - @vitejs/plugin-react (Vite React plugin)
    - Existing: sigma, graphology, graphology-layout-forceatlas2, three

    Estimated times:
    - Scout phase: ~10 min (dependency mapping, interface contracts, IMPL doc)
    - Agent execution: ~15 min (6 agents x 8 min avg, 2 waves parallel)
    - Merge and verification: ~5 min
    Total Polywave time: ~30 min

    Sequential baseline: ~50 min (6 agents x 8 min avg sequential)
    Time savings: ~20 min (40% faster)

    Recommendation: Clear speedup. Proceed.
test_command: command npm run build
lint_command: npx tsc --noEmit
