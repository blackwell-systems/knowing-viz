          task: |
            ## GraphViewer + Galaxy3D + StatusBar Components

            ### What to implement

            1. **src/components/GraphViewer.tsx** (NEW): The main 2D graph view component.
               Uses @react-sigma/core's SigmaContainer as the rendering wrapper.

               Key architecture:
               - SigmaContainer wraps the Sigma.js WebGL canvas and provides React context
               - useGraphLoader (from store hooks) builds the graphology Graph
               - useOverlayEffects (from store hooks) applies view overlays
               - GraphEvents child component handles click/hover via useRegisterEvents

               ```tsx
               import { useEffect, useMemo } from 'react';
               import { SigmaContainer } from '@react-sigma/core';
               import '@react-sigma/core/lib/style.css';
               import { useGraphStore } from '../store';
               import { useGraphLoader } from '../hooks/useGraphLoader';
               import { GraphEvents } from './GraphEvents';

               export function GraphViewer() {
                 const viewMode = useGraphStore((s) => s.viewMode);
                 const sigmaGraph = useGraphStore((s) => s.sigmaGraph);
                 const settings = useGraphStore((s) => s.settings);

                 useGraphLoader();

                 if (viewMode === 'galaxy3d' || !sigmaGraph) return null;

                 const sigmaSettings = useMemo(() => ({
                   defaultEdgeType: 'arrow' as const,
                   renderEdgeLabels: false,
                   labelRenderedSizeThreshold: 8,
                   labelColor: { color: '#c9d1d9' },
                   labelFont: `${settings.labelSize}px -apple-system, BlinkMacSystemFont, sans-serif`,
                   labelWeight: 'bold',
                   defaultNodeColor: '#58a6ff',
                   defaultEdgeColor: '#30363d',
                   stagePadding: 40,
                   zIndex: true,
                   minCameraRatio: 0.08,
                   maxCameraRatio: 8,
                 }), [settings.labelSize]);

                 return (
                   <SigmaContainer
                     graph={sigmaGraph}
                     settings={sigmaSettings}
                     className="graph-container"
                     style={{ flex: 1 }}
                   >
                     <GraphEvents />
                   </SigmaContainer>
                 );
               }
               ```

            2. **src/components/GraphEvents.tsx** (NEW): Child component inside SigmaContainer
               that registers event handlers and applies overlays. Must be inside
               SigmaContainer to access Sigma context.

               ```tsx
