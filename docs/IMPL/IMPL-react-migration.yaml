               ```

            3. **src/components/Galaxy3D.tsx** (NEW): 3D galaxy view using react-force-graph-3d.
               This replaces the custom Three.js implementation in galaxy3d.ts with a
               declarative React component.

               ```tsx
               import { useMemo, useCallback } from 'react';
               import ForceGraph3D from 'react-force-graph-3d';
               import { useGraphStore } from '../store';
               import { COMMUNITY_COLORS } from '../constants';

               export function Galaxy3D() {
                 const viewMode = useGraphStore((s) => s.viewMode);
                 const graph = useGraphStore((s) => s.graph);

                 const graphData = useMemo(() => {
                   if (!graph) return { nodes: [], links: [] };

                   // Port filtering logic from galaxy3d.ts lines 18-53
                   const topCommunities = [...graph.communities]
                     .sort((a, b) => b.size - a.size)
                     .slice(0, 15)
                     .map(c => c.id);
                   const topCommSet = new Set(topCommunities);

                   const significantNodes = graph.nodes
                     .filter(n => topCommSet.has(n.community))
                     .slice(0, 500);
                   const nodeIds = new Set(significantNodes.map(n => n.id));

                   const nodes = significantNodes.map(n => ({
                     id: n.id,
                     name: n.shortName,
                     community: n.community,
                     kind: n.kind,
                     color: COMMUNITY_COLORS[n.community % COMMUNITY_COLORS.length],
                     val: n.kind === 'service' ? 6 : n.kind === 'type' ? 3 : 2,
                   }));

                   const links: { source: string; target: string; color: string }[] = [];
                   const seenEdges = new Set<string>();
                   for (const edge of graph.edges) {
                     if (!nodeIds.has(edge.source) || !nodeIds.has(edge.target)) continue;
                     if (edge.source === edge.target) continue;
                     const key = `${edge.source}-${edge.target}`;
                     if (seenEdges.has(key)) continue;
                     seenEdges.add(key);
                     links.push({
                       source: edge.source,
                       target: edge.target,
                       color: edge.crossCommunity ? 'rgba(248,81,73,0.6)' : 'rgba(100,116,139,0.35)',
                     });
                   }

                   return { nodes, links };
                 }, [graph]);

                 const nodeColor = useCallback((node: any) => node.color, []);
                 const nodeVal = useCallback((node: any) => node.val, []);
                 const nodeLabel = useCallback((node: any) => `${node.name} (${node.kind})`, []);
                 const linkColor = useCallback((link: any) => link.color, []);

                 if (viewMode !== 'galaxy3d' || !graph) return null;

                 return (
                   <div className="graph-container galaxy3d-container">
                     <ForceGraph3D
                       graphData={graphData}
                       backgroundColor="#000000"
                       nodeColor={nodeColor}
                       nodeVal={nodeVal}
                       nodeLabel={nodeLabel}
                       nodeOpacity={0.9}
                       linkColor={linkColor}
                       linkWidth={0.8}
                       linkOpacity={0.8}
                       linkDirectionalArrowLength={3}
                       linkDirectionalArrowRelPos={1}
                       linkDirectionalParticles={(link: any) => link.color.includes('248,81,73') ? 4 : 1}
                       linkDirectionalParticleWidth={1.5}
                       linkDirectionalParticleSpeed={0.004}
                       linkDirectionalParticleColor={(link: any) => link.color.includes('248,81,73') ? '#f85149' : '#58a6ff'}
                       enableNodeDrag={true}
                       enableNavigationControls={true}
                       showNavInfo={false}
                     />
                   </div>
                 );
               }
               ```

               Note: react-force-graph-3d handles its own Three.js setup, resize, and
               cleanup internally. No manual Three.js management needed. The UnrealBloomPass
               from the original galaxy3d.ts can be added later as an enhancement; skip it
               for the initial migration to keep things simple.

