interface_contracts:
    - name: GraphStore
      description: |
        Zustand store shape. Central state for the entire application. All components
        read from this store; actions are the only way to mutate state. Note: Sigma
        instance is NOT stored here; @react-sigma/core provides its own useSigma()
        hook via SigmaContainer context.
      definition: |
        import { create } from 'zustand';
        import type { KnowingGraph, GraphNode, GraphEdge } from './graph-data';
        import Graph from 'graphology';

        export type ViewMode = 'communities' | 'blast-radius' | 'provenance' | 'blame' | 'coverage' | 'timeline' | 'galaxy3d';
        export type GroupBy = 'community' | 'package' | 'author';

        export interface DisplaySettings {
          nodeScale: number;       // 0.5-3.0, default 1.0
          topLabelCount: number;   // 0-100, default 40
          edgeOpacity: number;     // 0-1, default 1.0
          labelSize: number;       // 6-20, default 11
          gravity: number;         // 0.1-5.0, default 1.0
          spread: number;          // 5-100, default 10
          maxNodes: number;        // 50-10000, default 10000
          confidenceMin: number;   // 0-1, default 0
          crossCommunityOnly: boolean; // default false
        }

        export interface GraphState {
          // Data
          graph: KnowingGraph | null;
          graphFileName: string;
          sigmaGraph: Graph | null;  // graphology instance for Sigma rendering

          // View state
          viewMode: ViewMode;
          groupBy: GroupBy;
          selectedNode: GraphNode | null;
          selectedEdges: GraphEdge[];
          activeCommunityIds: Set<number>;
          searchQuery: string;
          settings: DisplaySettings;

          // Overlay state (derived, used by GraphEvents)
          blameAuthorColors: Map<string, string>;  // populated when blame overlay is applied

          // Group labels derived from current sigma graph
          groupLabels: { id: number; label: string; size: number }[];

          // Actions
          setGraph: (graph: KnowingGraph, fileName?: string) => void;
          setViewMode: (mode: ViewMode) => void;
          setGroupBy: (groupBy: GroupBy) => void;
          selectNode: (node: GraphNode | null, edges?: GraphEdge[]) => void;
          toggleCommunity: (id: number) => void;
          clearCommunities: () => void;
          setSearchQuery: (query: string) => void;
          updateSettings: (partial: Partial<DisplaySettings>) => void;
          resetSettings: () => void;
          setSigmaGraph: (g: Graph | null) => void;
          setGroupLabels: (labels: { id: number; label: string; size: number }[]) => void;
          setBlameAuthorColors: (colors: Map<string, string>) => void;
        }

        export const useGraphStore = create<GraphState>()((set) => ({ ... }));
      location: src/store.ts
    - name: useGraphLoader
      description: |
        Hook that builds a graphology Graph from the KnowingGraph data in the store,
        applying current settings (groupBy, maxNodes, nodeScale, edgeOpacity, etc.).
        This replaces the graph-building logic from renderSigma() in galaxy.ts.
        Returns the graphology Graph and group labels, and stores them in the Zustand store.
      definition: |
        export function useGraphLoader(): void;
      location: src/hooks/useGraphLoader.ts
    - name: useOverlayEffects
      description: |
        Hook that applies view-specific overlays (provenance, blame, coverage, blast,
        diff, search highlight) to the sigma graph instance. Uses useSigma() from
        @react-sigma/core to access the live Sigma instance and graph. Subscribes to
        store viewMode, selectedNode, searchQuery, and activeCommunityIds.
      definition: |
        export function useOverlayEffects(): void;
      location: src/hooks/useOverlayEffects.ts
    - name: communityColor
      description: Shared color utility extracted from the duplicated COMMUNITY_COLORS arrays.
      definition: |
        export const COMMUNITY_COLORS: string[];
        export function communityColor(id: number): string;
      location: src/constants.ts
waves:
    - number: 1
      agents:
        - id: A
          task: |
            ## Vite + React Scaffold

            ### What to implement
            Convert the project from vanilla TypeScript to React + Vite + TypeScript.
            Install all required dependencies including the new React wrapper libraries.

            1. **package.json**: Add all React dependencies. Run these commands:
               ```bash
               cd /Users/dayna.blackwell/code/knowing-viz && command npm install react react-dom zustand @react-sigma/core react-force-graph-3d @react-three/fiber @react-three/drei framer-motion
               cd /Users/dayna.blackwell/code/knowing-viz && command npm install -D @types/react @types/react-dom @vitejs/plugin-react
               ```

            2. **vite.config.ts**: Add the React plugin. Current contents:
               ```typescript
               import { defineConfig } from 'vite'
               export default defineConfig({
                 base: '/knowing-viz/',
                 build: { outDir: 'dist' }
               })
               ```
               Replace with:
               ```typescript
               import { defineConfig } from 'vite'
               import react from '@vitejs/plugin-react'
               export default defineConfig({
                 base: '/knowing-viz/',
                 plugins: [react()],
                 build: { outDir: 'dist' }
               })
               ```

            3. **tsconfig.json**: Add JSX support. Current contents:
               ```json
               {
                 "compilerOptions": {
                   "target": "ES2022",
                   "module": "ESNext",
                   "moduleResolution": "bundler",
                   "strict": true,
                   "esModuleInterop": true,
                   "outDir": "dist",
                   "rootDir": "src",
                   "declaration": true,
                   "sourceMap": true
                 },
                 "include": ["src"]
               }
               ```
               Add `"jsx": "react-jsx"` and `"skipLibCheck": true` to compilerOptions.

            4. **index.html**: Replace the entire body content with a single React root div.
               Keep the same `<head>` (charset, viewport, title). Remove the CSS link
               `<link rel="stylesheet" href="/styles/graph.css" />`.
               Remove ALL the DOM structure (sidebar, main, detail-panel aside).
               Replace body with:
               ```html
               <body>
                 <div id="root"></div>
                 <script type="module" src="/src/main.tsx"></script>
               </body>
               ```

            5. **src/main.tsx** (NEW): React entry point:
