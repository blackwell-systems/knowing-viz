<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>knowing - Graph Explorer</title>
  <link rel="stylesheet" href="/styles/graph.css" />
</head>
<body>
  <!-- Left Sidebar: Communities -->
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>knowing</h1>
      <span class="subtitle">Graph Explorer</span>
    </div>
    <div id="search-box">
      <input type="text" id="search" placeholder="Search symbols, files, types..." />
    </div>
    <div id="view-toggles">
      <h3>Views</h3>
      <button data-view="communities" class="active">Communities</button>
      <button data-view="blast-radius">Blast Radius</button>
      <button data-view="provenance">Provenance</button>
      <button data-view="blame">Blame</button>
      <button data-view="coverage">Coverage</button>
      <button data-view="timeline">Timeline</button>
      <button data-view="galaxy3d">Galaxy 3D</button>
    </div>
    <div id="community-list">
      <h3>Communities</h3>
      <div id="communities"></div>
    </div>
    <div id="settings-panel">
      <h3>Settings</h3>
      <label class="toggle-row">
        <input type="checkbox" id="cross-community-only" />
        <span>Cross-community only</span>
      </label>
      <div class="slider-row">
        <span class="slider-label">Confidence</span>
        <input type="range" id="confidence-min" min="0" max="100" value="0" />
        <span class="slider-value" id="confidence-val">0%</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Node size</span>
        <input type="range" id="node-size" min="5" max="30" value="10" />
        <span class="slider-value" id="node-size-val">1.0x</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Labels</span>
        <input type="range" id="label-count" min="0" max="100" value="40" />
        <span class="slider-value" id="label-count-val">40</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Label size</span>
        <input type="range" id="label-size" min="6" max="20" value="11" />
        <span class="slider-value" id="label-size-val">11px</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Edges</span>
        <input type="range" id="edge-opacity" min="0" max="100" value="100" />
        <span class="slider-value" id="edge-opacity-val">100%</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Gravity</span>
        <input type="range" id="gravity" min="1" max="50" value="10" />
        <span class="slider-value" id="gravity-val">1</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Spread</span>
        <input type="range" id="spread" min="5" max="100" value="10" />
        <span class="slider-value" id="spread-val">30</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Max nodes</span>
        <input type="range" id="max-nodes" min="50" max="1500" value="600" step="50" />
        <span class="slider-value" id="max-nodes-val">600</span>
      </div>
    </div>
    <div id="toolbar">
      <button id="btn-screenshot">Screenshot</button>
      <button id="btn-fit">Fit</button>
      <button id="btn-reset">Reset</button>
    </div>
  </aside>

  <!-- Graph Canvas -->
  <main id="main">
    <div id="graph-container"></div>
    <div id="status-bar">
      <span id="node-count">Nodes: --</span>
      <span id="edge-count">Edges: --</span>
      <span id="community-count">Communities: --</span>
      <span id="cross-count">Cross-community: --</span>
    </div>
  </main>

  <!-- Right Panel: Symbol Detail -->
  <aside id="detail-panel" class="hidden">
    <div id="detail-header">
      <h3 id="detail-name">Select a symbol</h3>
      <button id="detail-close">&times;</button>
    </div>
    <div id="detail-body">
      <div id="selected-info"><em>Click a node to see details</em></div>
    </div>
  </aside>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
